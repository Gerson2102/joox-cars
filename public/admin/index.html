    <title>Panel · JOOX CARS</title>
    <!-- Absolute path, so the config loads whether the panel is opened at /admin or /admin/index.html. -->
    <link href="/admin/config.yml" type="application/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Sveltia CMS, free and open source. Pinned to one version with its integrity hash, so the
         browser refuses a file that isn't exactly it. To move to a newer version: npm run cms:update -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.227.3/dist/sveltia-cms.js"
      integrity="sha384-8hMzaf/90SQ5tmWKilMTR2nNU+HEw84lYds8R0eo32rjS6u1h98IrxiM3Jde+XLN"
      crossorigin="anonymous"
    ></script>
  </body>
